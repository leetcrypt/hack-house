deliverables = [
  "/root/scankit/scan.py — threaded TCP connect scan, UDP probe, banner grab, fingerprint match, nmap-style grepable output",
  "/root/scankit/fingerprints.json",
  "/root/scankit/lab.py — spins up sample services on localhost",
  "/root/README.md",
]
verify = "scan.py against the local lab finds the open ports and fingerprints at least the HTTP service"
tags = ["network", "scanning", "recon", "security"]

[[brief]]
label = "yara-triage-vm"
title = "YARA triage VM — curated ruleset + safe test samples + scanning orchestrator"
mission = "A malware-triage bench built around YARA: a curated, documented ruleset, safe test samples (EICAR + benign), and an orchestrator that scans + reports."
topology = "planner+builder"
software = ["pip:yara-python"]
data = "curated YARA rules (packers, suspicious-strings, EICAR, script-droppers — detection patterns only) + safe samples (EICAR test file, benign scripts) under /root/samples/"
deliverables = [
  "/root/yaratriage/scan.py — recursive scan, rule-hit report, severity scoring",
  "/root/yaratriage/rules/*.yar (documented)",
  "/root/samples/* (EICAR + benign only)",
  "/root/README.md",
]
verify = "scan.py flags the EICAR test file via the EICAR rule and reports zero hits on the benign samples"
tags = ["malware", "yara", "triage", "security"]
